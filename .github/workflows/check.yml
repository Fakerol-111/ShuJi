name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cd shuji-app/src-tauri && cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system deps (Tauri)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      # 使用 -W clippy::all 确保新代码无新增 warning（存量已通过 #![allow] 处理）
      - name: Clippy check
        run: cd shuji-app/src-tauri && cargo clippy --all-targets -- -W clippy::all

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Tauri)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - name: Cargo check
        run: cd shuji-app/src-tauri && cargo check

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Tauri)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - name: Run unit tests
        run: cd shuji-app/src-tauri && cargo test --lib
      - name: Run integration tests
        run: cd shuji-app/src-tauri && RUST_BACKTRACE=1 cargo test --tests -- --skip expand_requirements --skip workflow_demo --test-threads=1

  # Windows 轻量 job：避免重复安装 Tauri 系统依赖，只跑 cargo check + 单元测试
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cd shuji-app/src-tauri && cargo check
      - name: Run unit tests
        run: cd shuji-app/src-tauri && cargo test --lib

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: cd shuji-app && npm install
      - name: Prettier format check
        run: cd shuji-app && npm run format:check
      - name: TypeScript lint (noEmit)
        run: cd shuji-app && npm run lint
      - name: Vitest
        run: cd shuji-app && npm test
      - name: Vite build
        run: cd shuji-app && npm run build
