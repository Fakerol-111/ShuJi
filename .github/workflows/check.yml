name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cd shuji-app/src-tauri && cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system deps (Tauri)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      # 使用 -W clippy::all 确保新代码无新增 warning（存量已通过 #![allow] 处理）
      - name: Clippy check
        run: cd shuji-app/src-tauri && cargo clippy --all-targets -- -W clippy::all

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Tauri)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - name: Cargo check
        run: cd shuji-app/src-tauri && cargo check

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Tauri)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - name: Run unit tests
        run: cd shuji-app/src-tauri && cargo test --lib
      - name: Run integration tests
        run: cd shuji-app/src-tauri && RUST_BACKTRACE=1 cargo test --tests -- --skip expand_requirements --test-threads=1
      - name: Pipeline integration tests
        run: cd shuji-app/src-tauri && cargo test --test pipeline_test -- --test-threads=1
      - name: Workflow mock tests
        run: cd shuji-app/src-tauri && cargo test --test workflow_mock_test --test workflow_demo_test -- --test-threads=1
      - name: Scenario replay tests
        run: cd shuji-app/src-tauri && cargo test --test scenario_replay_test -- --test-threads=1

  # Windows 轻量 job：避免重复安装 Tauri 系统依赖，只跑 cargo check + 单元 + 轻量集成
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cd shuji-app/src-tauri && cargo check
      - name: Run unit tests
        run: cd shuji-app/src-tauri && cargo test --lib
      - name: Run lightweight integration tests (no GUI)
        run: cd shuji-app/src-tauri && cargo test --test document_test --test audit_test --test path_security_test --test pipeline_test --test validate_test --test scenario_replay_test -- --test-threads=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: cd shuji-app && npm install
      - name: Prettier format check
        run: cd shuji-app && npm run format:check
      - name: TypeScript lint (noEmit)
        run: cd shuji-app && npm run lint
      - name: Vitest
        run: cd shuji-app && npm test
      - name: Vite build
        run: cd shuji-app && npm run build

  # Markdown 本地死链检查
  # 防止 ARCHITECTURE.md / AGENT_TASKS.md 这类文件被删除但引用未清理的回退复发。
  # 只检查本地文件链路（https/http 链接在 .lycheeignore 中排除）。
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # 扫描所有 .md 文件（不含 node_modules/target，已在 .lycheeignore 排除）
          args: >-
            --no-progress
            --accept 200,999
            --root .
            '**/*.md'
          # 死链视为 error（CI 失败）
          fail: true

  # 测试数量统计
  # 运行 scripts/count_tests.sh，输出 JSON 到 CI 日志，作为文档"约 N 个测试"的单一真相源。
  # 文档引用脚本而非硬编码数字，避免漂移。
  test-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count tests (Rust + frontend)
        run: bash scripts/count_tests.sh
