name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ── Windows ──
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shuji-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
        working-directory: shuji-app
      - name: Build Tauri app
        run: npm run tauri build
        working-directory: shuji-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: shuji-windows-nsis
          path: shuji-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: shuji-windows-msi
          path: shuji-app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # ── macOS ──
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shuji-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
        working-directory: shuji-app
      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}
        working-directory: shuji-app
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: shuji-macos-${{ matrix.target }}
          path: shuji-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ── Linux ──
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shuji-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - name: Install frontend dependencies
        run: npm ci
        working-directory: shuji-app
      - name: Build Tauri app
        run: npm run tauri build
        working-directory: shuji-app
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: shuji-linux-deb
          path: shuji-app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: shuji-linux-appimage
          path: shuji-app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ── Release ──
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
