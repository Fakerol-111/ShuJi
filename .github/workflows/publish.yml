name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
            bundle: nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shuji-app/package-lock.json

      - name: Setup Rust
        uses: actions-rust/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: shuji-app

      - name: Build Tauri app
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
        working-directory: shuji-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuji-${{ matrix.os }}-${{ matrix.bundle }}
          path: shuji-app/src-tauri/target/release/bundle/${{ matrix.bundle }}/*.exe
          if-no-files-found: error

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: shuji-app/src-tauri/target/release/bundle/${{ matrix.bundle }}/*.exe
          draft: true
          generate_release_notes: true
