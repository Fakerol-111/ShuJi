# ShuJi 运行时配置文件
# 所有配置项都有合理的默认值，可以根据需要调整

[api]
# API 请求超时时间（秒）
# 稳定化阶段：从 180s 缩短到 90s，加快失败反馈
timeout_secs = 90

# API 请求最大重试次数（仅对 429/5xx/网络错误）
# 稳定化阶段：从 10 次减少到 3 次
# 400/401/403/422 不进入重试
max_retries = 3

# 截断响应最大重试次数（finish_reason=length）
# 保持 5 次：截断是 token 预算问题，需要较多尝试
length_max_retries = 5

[api.reasoning]
# 推理/思考模式（对非Anthropic API默认为开启）
# 开启后 API 返回中会包含 reasoning_content（思考链）和 content（最终回答）
enabled = true

# 思考预算 token 数（0 = 使用模型默认值，仅 Anthropic extended thinking 有效）
budget_tokens = 0

[api.generation]
# LLM 生成参数（temperature, top_p, frequency_penalty）
temperature = 0.1
top_p = 0.9
frequency_penalty = 0.1

# seed = 0 时不发送该字段（并非所有 API 都支持）
seed = 0

# per-role 生成参数覆盖（可选）
# [api.generation.role_overrides.zhongshuling]
# temperature = 0.3  # 设计允许更多创造性
# [api.generation.role_overrides.gongbushangshu]
# temperature = 0.0  # 编码需要确定性

[api.streaming]
# 工具 agent 真流式（OpenAI 兼容 API）。默认开启。
# Anthropic API 暂不支持，始终使用 step()。
# 如果流式遇到兼容性问题，可关闭回退到非流式。
enabled = true

[api.max_tokens]
# 设为 0 表示不发送 max_tokens，让模型/服务端自行使用可用上限。
# 非 0 值则限制输出 token 数，减少 token 浪费。
# 写文件类 agent (工部、兵部) 的 max_tokens — 0=不限，写代码需要较大输出
write_file = 0

# 追加文档类 agent (中书令、吏部、刑部) 的 max_tokens
append_document = 4096

# 只读类 agent (礼部) 的 max_tokens
readonly = 2048

# 纯文本类 agent (内阁、尚书令、门下侍中) 的 max_tokens
text_only = 1024

[tool_iterations]
# 只读操作的最大迭代次数
readonly = 80

# 写文件密集操作的最大迭代次数
write_heavy = 60

# 文档操作密集的最大迭代次数
document_heavy = 100

[context_compaction]
# DeepSeek 1M 窗口：接近上限再压缩（cl100k token 计数，仅 context_messages 层）
# 750k tokens 对话层 + system/tools/输出余量；未在内置列表中的角色使用此值
token_threshold = 750000

# 压缩后保留的最近消息数
keep_recent_count = 24

# 启用 mid-run 压缩：长运行 actor（工部 60 轮、内阁 100 轮）在 tool loop 中途
# 将上下文持久化到磁盘，避免进程崩溃时丢失中期状态。
# 运行中的 session 不受影响——压缩版在下次 execute() 时自动加载。
mid_run_compact = true

[actor]
# 单个 actor 执行的最大迭代次数
max_exec_iterations = 20

# 工部计划循环的最大迭代次数
max_plan_iterations = 6

[watchdog]
# 连续错误的最大次数
max_consecutive_errors = 5

# 触发警告的重复工具调用次数
same_tool_warning_count = 3

# 触发警告的连续读取次数（无写入）
read_without_write_warning = 5

# run_tests 连续失败多少次后注入 playbook 干预
# 调试复杂测试时可能需要更多尝试，可以适当调高
test_stalemate_threshold = 5

# delete->create 循环多少次后触发警告
delete_create_warning_count = 2

[approval]
# manual=等待用户朱批, auto=自动放行
mode = "manual"
# auto 模式：内阁连续 N 轮未请示后自动放行
auto_retries = 3
