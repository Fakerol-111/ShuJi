[package]
name = "shuji-app"
version = "0.8.0"
description = "ShuJi - Automated software development system"
authors = ["Fakerol"]
edition = "2021"

[lib]
name = "shuji_app_lib"
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "process", "fs", "io-util", "time", "macros"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
rand = "0.8"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1"
toml = "0.8"
diffy = "0.4"
tiktoken-rs = "0.6"
sha2 = "0.10"
regex-lite = "0.1"
jsonschema = "0.18"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
criterion = "0.5"

[[bench]]
name = "core_functions"
harness = false


